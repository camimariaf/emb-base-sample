# ============================================================
# Configurações do Sistema SNTP + ZBus
# Atividade 04 - Sistemas Embarcados
# ============================================================

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y

# ZBus (Event Bus) - Sistema de mensagens
CONFIG_ZBUS=y
CONFIG_ZBUS_PRIORITY_BOOST=y

# POSIX API - Necessário para funções de tempo
CONFIG_POSIX_API=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Heap memory (se necessário para alocações dinâmicas)
CONFIG_HEAP_MEM_POOL_SIZE=4096
